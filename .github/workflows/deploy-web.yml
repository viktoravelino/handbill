name: Deploy web

# handbill.dev is apps/web, built and deployed from main by this workflow and
# nothing else. Every push to main deploys: the site renders the README, docs/
# and the CLI's --help, so a paths filter would only ever be incomplete. Needs two
# repository secrets, CLOUDFLARE_API_TOKEN (the token from docs/SELF-HOSTING.md
# step 1 will do) and CLOUDFLARE_ACCOUNT_ID; forks have neither, so the job only
# runs in the upstream repository.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-web
  cancel-in-progress: true

jobs:
  deploy:
    if: github.repository == 'viktoravelino/handbill'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.9
      - run: bun install --frozen-lockfile
      - run: bun run --cwd apps/web build
      - run: bunx wrangler deploy
        working-directory: apps/web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
