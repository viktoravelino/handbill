name: Deploy web

# handbill.dev is apps/web, built and deployed from main by this workflow and
# nothing else. Every push to main deploys: the site renders the README, docs/
# and the CLI's --help, so a paths filter would only ever be incomplete. Needs two
# repository secrets, CLOUDFLARE_API_TOKEN (the token from docs/SELF-HOSTING.md
# step 1 will do) and CLOUDFLARE_ACCOUNT_ID; forks have neither, so the job only
# runs in the upstream repository.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-web
  cancel-in-progress: true

jobs:
  deploy:
    if: github.repository == 'viktoravelino/handbill'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.9
      - run: bun install --frozen-lockfile
      - run: bun run --cwd apps/web build
      # The workspace-installed wrangler (apps/web/package.json), not whatever
      # `bunx` would fetch — same pattern as apps/worker/scripts/size.ts.
      - run: ./node_modules/.bin/wrangler deploy
        working-directory: apps/web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
