# Daily metrics snapshot onto the orphan `metrics` branch — GitHub's traffic
# API forgets after 14 days, so this is what makes the numbers history.
# Secrets: METRICS_PAT (fine-grained, this repo, Administration: read — the
# default token 403s on traffic endpoints), CLOUDFLARE_ANALYTICS_TOKEN
# (Account Analytics: read). Missing secrets skip their section, not the run.
name: Metrics
on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          ref: metrics
          path: metrics-data
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Snapshot
        env:
          REPO: ${{ github.repository }}
          DATA_DIR: metrics-data/data
          METRICS_PAT: ${{ secrets.METRICS_PAT }}
          GITHUB_TOKEN: ${{ github.token }}
          NPM_PACKAGE: handbill
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_ANALYTICS_TOKEN }}
          CF_ACCOUNT_TAG: 3fff044e404555e02738d5815c24539e
          CF_SITE_TAG: 5747f4934a534c4aa86b678441cf5c77
        run: node .github/scripts/metrics.mjs
      - name: Commit
        working-directory: metrics-data
        run: |
          git config user.name "metrics[bot]"
          git config user.email "metrics@users.noreply.github.com"
          git add data
          git diff --cached --quiet && echo "no change" && exit 0
          git commit -m "metrics: $(date -u +%F)"
          git push origin metrics
