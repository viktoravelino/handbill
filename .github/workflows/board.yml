name: Board

# Keeps the project board (viktoravelino/projects/8) in step with review state,
# reconciling from what is on the PR whenever an event we receive fires:
#   PR opened / pushed                         → In Review
#   a human approves the head commit           → Ready to Merge
#   a human requests changes                   → In Review
# A clean Copilot review on its own does not move the card: GitHub creates no
# workflow run for review events submitted by the Copilot reviewer bot on a
# public repo, and Copilot never approves. The maintainer's approval is the signal.
# Needs the PROJECT_TOKEN secret (GITHUB_TOKEN cannot touch user-owned projects):
# a classic personal access token with scopes `project`, `public_repo`, and
# `read:org` (gh's project commands look the owner up as user *and* organization,
# and the organization lookup needs read:org even for a user-owned project).
# Without the secret the job is skipped.

on:
  pull_request:
    types: [opened, reopened, ready_for_review, synchronize]
  pull_request_review:
    types: [submitted]
  workflow_dispatch:
    inputs:
      pr:
        description: PR number to reconcile (empty = all open PRs)
        required: false

permissions:
  contents: read
  pull-requests: read
  issues: read

concurrency:
  group: board
  cancel-in-progress: false

jobs:
  reconcile:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.PROJECT_TOKEN }}
    steps:
      - name: Skip without PROJECT_TOKEN
        if: env.GH_TOKEN == ''
        run: echo "PROJECT_TOKEN not set; skipping board update"

      - uses: actions/checkout@v7
        if: env.GH_TOKEN != ''

      - name: Reconcile
        if: env.GH_TOKEN != ''
        env:
          PR: ${{ github.event.pull_request.number || inputs.pr }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [[ -n "${PR:-}" ]]; then
            .claude/skills/board/reconcile.sh "$PR"
          else
            .claude/skills/board/reconcile.sh
          fi
