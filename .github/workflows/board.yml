name: Board

# Keeps the project board (viktoravelino/projects/8) in step with review state:
#   PR opened / reopened / ready     → linked issues to "In Review"
#   Copilot review with no comments  → "Ready to Merge"
#   Copilot review with comments     → "In Review"
#   human approves                   → "Ready to Merge"
#   human requests changes           → "In Review"
# Needs the PROJECT_TOKEN secret (GITHUB_TOKEN cannot touch user-owned projects):
# a fine-grained PAT with repository access to this repo and
#   - Pull requests: read   (review comments, via REST)
#   - Issues: read          (closingIssuesReferences, via GraphQL)
#   - Metadata: read        (implied)
# plus the account permission Projects: read & write. Without it the job is skipped.

on:
  pull_request:
    types: [opened, reopened, ready_for_review, synchronize]
  pull_request_review:
    types: [submitted]

permissions:
  contents: read
  pull-requests: read
  issues: read

jobs:
  move:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.PROJECT_TOKEN }}
    steps:
      - name: Skip without PROJECT_TOKEN
        if: env.GH_TOKEN == ''
        run: echo "PROJECT_TOKEN not set; skipping board update"

      - uses: actions/checkout@v5
        if: env.GH_TOKEN != ''

      - name: Decide target column
        if: env.GH_TOKEN != ''
        id: decide
        env:
          EVENT: ${{ github.event_name }}
          REVIEWER: ${{ github.event.review.user.login }}
          STATE: ${{ github.event.review.state }}
          REVIEW_ID: ${{ github.event.review.id }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [[ "$EVENT" == "pull_request" ]]; then
            target="review"
          elif [[ "$REVIEWER" == "copilot-pull-request-reviewer[bot]" ]]; then
            # Copilot's review body is never empty (it always carries an overview), so
            # "clean" means: no inline comments AND the summary does not flag findings.
            # Its header reads "Changes recommended" whenever it found something, including
            # findings it chose to suppress rather than post inline.
            comments=$(gh api "repos/$REPO/pulls/$PR/reviews/$REVIEW_ID/comments" --jq length)
            body=$(gh api "repos/$REPO/pulls/$PR/reviews/$REVIEW_ID" --jq '.body // ""')
            if [[ "$comments" == "0" ]] && ! grep -qi "changes recommended" <<<"$body"; then
              target="ready"
            else
              target="review"
            fi
          elif [[ "$STATE" == "approved" ]]; then
            target="ready"
          elif [[ "$STATE" == "changes_requested" ]]; then
            target="review"
          else
            target=""
          fi
          echo "target=$target" >> "$GITHUB_OUTPUT"
          echo "event=$EVENT reviewer=${REVIEWER:-} state=${STATE:-} → ${target:-no-op}"

      - name: Debug token (temporary)
        if: env.GH_TOKEN != ''
        run: |
          echo "scopes: $(gh api -i user 2>/dev/null | grep -i '^x-oauth-scopes' || echo 'none reported')"
          echo "viewer: $(gh api graphql -f query='{ viewer { login } }' 2>&1 | head -c 300)"
          echo "user+project: $(gh api graphql -f query='{ user(login:"viktoravelino") { id projectV2(number:8) { id } } }' 2>&1 | head -c 400)"
          echo "org lookup: $(gh api graphql -f query='{ organization(login:"viktoravelino") { id } }' 2>&1 | head -c 300)"
          gh project view 8 --owner viktoravelino --format json 2>&1 | head -c 300 || true

      - name: Move linked issues
        if: env.GH_TOKEN != '' && steps.decide.outputs.target != ''
        env:
          TARGET: ${{ steps.decide.outputs.target }}
          PR: ${{ github.event.pull_request.number }}
          OWNER: ${{ github.repository_owner }}
          NAME: ${{ github.event.repository.name }}
        run: |
          set -euo pipefail
          issues=$(gh api graphql -f query='query($o:String!,$n:String!,$p:Int!){ repository(owner:$o,name:$n){ pullRequest(number:$p){ closingIssuesReferences(first:20){ nodes{ number } } } } }' \
            -f o="$OWNER" -f n="$NAME" -F p="$PR" --jq '.data.repository.pullRequest.closingIssuesReferences.nodes[].number')
          [[ -n "$issues" ]] || { echo "PR #$PR closes no issues; nothing to move"; exit 0; }
          for i in $issues; do .claude/skills/board/board.sh "$TARGET" "$i"; done
