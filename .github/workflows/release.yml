name: Release

# Tag main with v<version> (matching apps/cli/package.json) to publish the CLI
# to npm via trusted publishing (OIDC, provenance attached automatically) and
# create the GitHub release. See docs/RELEASING.md.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write # create the GitHub release
  id-token: write # npm provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.9

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run lint
      - run: bun test

      - name: Check the tag matches the package version
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          pkg=$(node -p "require('./apps/cli/package.json').version")
          [[ "$tag" == "$pkg" ]] || { echo "tag v$tag does not match apps/cli version $pkg" >&2; exit 1; }
          grep -q "const version = \"$pkg\"" apps/cli/src/cli.ts || { echo "apps/cli/src/cli.ts version literal is not $pkg" >&2; exit 1; }

      - run: bun run --cwd apps/cli build
      - run: node apps/cli/dist/cli.js --version

      # Trusted publishing (OIDC): no token, provenance is attached automatically.
      # The package's npm settings must list this repo + workflow as a trusted
      # publisher (docs/RELEASING.md). Skipped if this version is already on npm,
      # so a re-run after a failure past this point does not fail here.
      - name: Publish to npm
        working-directory: apps/cli
        run: |
          set -euo pipefail
          pkg=$(node -p "require('./package.json').version")
          if npm view "handbill@$pkg" version >/dev/null 2>&1; then
            echo "handbill@$pkg is already on npm; skipping publish"
          else
            npm publish --access public
          fi

      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --generate-notes --verify-tag
