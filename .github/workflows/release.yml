name: Release

# Tag main with v<version> (matching apps/cli/package.json) to publish the CLI
# to npm with provenance and create the GitHub release. See docs/RELEASING.md.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write # create the GitHub release
  id-token: write # npm provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.9

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run lint
      - run: bun test

      - name: Check the tag matches the package version
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          pkg=$(node -p "require('./apps/cli/package.json').version")
          [[ "$tag" == "$pkg" ]] || { echo "tag v$tag does not match apps/cli version $pkg" >&2; exit 1; }
          grep -q "const version = \"$pkg\"" apps/cli/src/cli.ts || { echo "apps/cli/src/cli.ts version literal is not $pkg" >&2; exit 1; }

      - run: bun --cwd apps/cli run build
      - run: node apps/cli/dist/cli.js --version

      # Two publish paths, one runs: NPM_TOKEN when the secret exists, otherwise
      # npm's OIDC trusted publishing (no token at all). See docs/RELEASING.md.
      - name: Publish to npm (token)
        if: env.NPM_TOKEN != ''
        working-directory: apps/cli
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --provenance --access public

      - name: Publish to npm (trusted publishing)
        if: env.NPM_TOKEN == ''
        working-directory: apps/cli
        run: npm publish --provenance --access public

      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --generate-notes --verify-tag
